<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS CRYPTO TRADING AGENT - Live Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg1: #0a0e27;
      --bg2: #141829;
      --bg3: #1a1f3a;
      --t1: #e4e6eb;
      --t2: #a0a6b8;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #a855f7;
    }
    
    body {
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--t1);
      font-family: 'Monaco', 'Courier New', monospace;
      overflow-x: hidden;
    }
    
    .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
    
    header { text-align: center; margin-bottom: 30px; padding: 20px; background: linear-gradient(135deg, var(--bg3), transparent); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 12px; }
    h1 { font-size: 2.5em; color: var(--purple); margin-bottom: 10px; text-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
    
    .status-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; padding: 15px; background: var(--bg3); border-radius: 8px; border: 1px solid rgba(59, 130, 246, 0.3); }
    .stat-box { padding: 12px; background: rgba(26, 31, 58, 0.8); border-radius: 6px; border-left: 3px solid var(--blue); }
    .stat-label { font-size: 11px; color: var(--t2); text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: bold; color: var(--t1); }
    .stat-value.profit { color: var(--green); }
    .stat-value.loss { color: var(--red); }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 1200px) { .grid { grid-template-columns: 1fr; } }
    
    .panel { background: var(--bg3); border: 1px solid rgba(168, 85, 247, 0.2); border-radius: 10px; padding: 20px; overflow: hidden; }
    .panel-title { font-size: 14px; font-weight: bold; color: var(--purple); text-transform: uppercase; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid rgba(168, 85, 247, 0.3); }
    
    .coin-row { display: grid; grid-template-columns: 50px 1fr 80px 80px 80px; gap: 10px; align-items: center; padding: 12px; background: rgba(26, 31, 58, 0.5); border-radius: 6px; margin-bottom: 10px; border-left: 3px solid transparent; }
    .coin-row.selected { border-left-color: var(--green); background: rgba(16, 185, 129, 0.1); }
    .coin-rank { font-weight: bold; color: var(--blue); text-align: center; }
    .coin-name { font-size: 12px; }
    .coin-price { text-align: right; font-size: 12px; color: var(--t2); }
    .coin-change { text-align: right; font-size: 12px; font-weight: bold; }
    .coin-change.up { color: var(--green); }
    .coin-change.down { color: var(--red); }
    .coin-score { text-align: right; font-size: 11px; font-weight: bold; padding: 4px 8px; background: rgba(168, 85, 247, 0.2); border-radius: 4px; }
    
    .trade-log { max-height: 400px; overflow-y: auto; border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 6px; padding: 10px; background: rgba(10, 14, 39, 0.5); }
    .trade-item { padding: 10px; margin-bottom: 8px; background: rgba(26, 31, 58, 0.8); border-left: 3px solid var(--blue); border-radius: 4px; font-size: 11px; line-height: 1.4; }
    .trade-item.buy { border-left-color: var(--green); }
    .trade-item.sell { border-left-color: var(--red); }
    .trade-time { color: var(--t2); font-size: 10px; margin-bottom: 4px; }
    .trade-desc { color: var(--t1); margin-bottom: 4px; }
    .trade-profit { color: var(--green); font-weight: bold; }
    
    .buttons { display: flex; gap: 10px; margin-top: 20px; }
    button { padding: 12px 24px; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, var(--purple), var(--blue)); color: white; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3); }
    .btn-secondary { background: rgba(168, 85, 247, 0.1); color: var(--purple); border: 1px solid var(--purple); }
    .btn-secondary:hover { background: rgba(168, 85, 247, 0.2); }
    
    .loader { display: inline-block; width: 4px; height: 4px; background: var(--purple); border-radius: 50%; animation: pulse 1s infinite; margin-right: 8px; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    
    .chart-container { height: 200px; background: rgba(10, 14, 39, 0.5); border-radius: 6px; padding: 10px; margin-top: 10px; display: flex; align-items: flex-end; gap: 3px; }
    .chart-bar { flex: 1; background: linear-gradient(180deg, var(--green), var(--blue)); border-radius: 3px 3px 0 0; min-height: 4px; opacity: 0.7; transition: all 0.3s; }
    .chart-bar:hover { opacity: 1; }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(26, 31, 58, 0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.5); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.8); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 NEXUS TRADING AGENT</h1>
      <p style="color: var(--t2); margin-top: 10px;">AI-Powered Crypto Trading with Real-Time Analysis</p>
    </header>
    
    <div class="status-bar">
      <div class="stat-box">
        <div class="stat-label">Portfolio Value</div>
        <div class="stat-value" id="portfolioValue">$10,000</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Current P&L</div>
        <div class="stat-value profit" id="currentProfit">+$0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">ROI</div>
        <div class="stat-value" id="currentROI">0%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Trades Made</div>
        <div class="stat-value" id="tradeCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Win Rate</div>
        <div class="stat-value" id="winRate">0%</div>
      </div>
    </div>
    
    <div class="grid">
      <div>
        <div class="panel">
          <div class="panel-title">🔍 Top 50 Coins Analysis</div>
          <div id="coinsList"></div>
          <div class="chart-container" id="priceChart"></div>
        </div>
      </div>
      
      <div>
        <div class="panel">
          <div class="panel-title">📊 Portfolio Holdings</div>
          <div id="holdings"></div>
        </div>
      </div>
    </div>
    
    <div class="panel">
      <div class="panel-title">📈 Live Trade Log</div>
      <div class="trade-log" id="tradeLog"></div>
    </div>
    
    <div class="buttons">
      <button class="btn-primary" onclick="startTrading()">
        <span class="loader" id="loader" style="display:none;"></span>
        <span id="btnText">🚀 Start Trading Agent</span>
      </button>
      <button class="btn-secondary" onclick="resetPortfolio()">↻ Reset Portfolio</button>
      <button class="btn-secondary" onclick="exportReport()">⬇ Export Report</button>
    </div>
  </div>

  <script>
    let state = {
      portfolio: {
        cash: 10000,
        initialCash: 10000,
        holdings: {},
        trades: [],
      },
      coins: [],
      isTrading: false,
    };
    
    const API_URL = window.location.hostname === 'localhost' 
      ? 'http://localhost:3000'
      : window.location.protocol + '//' + window.location.hostname;
    
    async function fetchTopCoins() {
      try {
        const res = await fetch(`${API_URL}/api/coingecko/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50&sparkline=true`);
        const data = await res.json();
        
        state.coins = data.map((coin, idx) => ({
          rank: idx + 1,
          id: coin.id,
          symbol: coin.symbol.toUpperCase(),
          name: coin.name,
          price: coin.current_price,
          change24h: coin.price_change_percentage_24h || 0,
          marketCap: coin.market_cap || 0,
          volume: coin.total_volume || 0,
          score: calculateScore(coin),
        }));
        
        displayCoins();
        return state.coins;
      } catch (e) {
        console.error('Fetch error:', e);
        addLog('❌ Failed to fetch coin data: ' + e.message);
      }
    }
    
    function calculateScore(coin) {
      let score = 0;
      if (coin.price_change_percentage_24h > 5) score += 20;
      else if (coin.price_change_percentage_24h > 0) score += 10;
      
      const volumeRatio = coin.total_volume / coin.market_cap;
      if (volumeRatio > 0.5) score += 25;
      else if (volumeRatio > 0.2) score += 15;
      
      if (coin.market_cap > 1000000000) score += 25;
      else if (coin.market_cap > 100000000) score += 15;
      
      if (coin.price_change_percentage_24h && Math.abs(coin.price_change_percentage_24h) < 15) score += 20;
      
      return Math.min(100, Math.round(score));
    }
    
    function displayCoins() {
      const sorted = [...state.coins].sort((a, b) => b.score - a.score);
      const html = sorted.slice(0, 15).map(coin => `
        <div class="coin-row ${coin.score > 70 ? 'selected' : ''}">
          <div class="coin-rank">#${coin.rank}</div>
          <div class="coin-name"><strong>${coin.symbol}</strong></div>
          <div class="coin-price">$${coin.price.toFixed(2)}</div>
          <div class="coin-change ${coin.change24h >= 0 ? 'up' : 'down'}">
            ${coin.change24h >= 0 ? '↑' : '↓'} ${Math.abs(coin.change24h).toFixed(2)}%
          </div>
          <div class="coin-score">${coin.score} pts</div>
        </div>
      `).join('');
      
      document.getElementById('coinsList').innerHTML = html || '<p style="color: var(--t2);">Loading...</p>';
      updateChart();
    }
    
    function updateChart() {
      const topCoins = state.coins.slice(0, 20);
      const heights = topCoins.map(coin => {
        const normalized = (coin.score / 100) * 100;
        return `<div class="chart-bar" style="height: ${normalized}%;"></div>`;
      }).join('');
      document.getElementById('priceChart').innerHTML = heights || '<p>Waiting...</p>';
    }
    
    async function startTrading() {
      if (state.isTrading) return;
      state.isTrading = true;
      document.getElementById('loader').style.display = 'inline-block';
      document.getElementById('btnText').textContent = 'Agent Trading...';
      
      addLog('🤖 Agent analyzing top 50 coins...');
      await fetchTopCoins();
      
      const bestCoins = state.coins.filter(c => c.score > 70).slice(0, 5);
      
      if (bestCoins.length === 0) {
        addLog('⚠️ No coins meet criteria');
        state.isTrading = false;
        document.getElementById('loader').style.display = 'none';
        document.getElementById('btnText').textContent = '🚀 Start Trading Agent';
        return;
      }
      
      for (const coin of bestCoins) {
        const investAmount = state.portfolio.cash / bestCoins.length * 0.8;
        if (investAmount > 50 && state.portfolio.cash > 0) {
          buyCoin(coin, investAmount);
          await new Promise(r => setTimeout(r, 800));
        }
      }
      
      addLog('📊 Monitoring positions...');
      await simulateHolding();
      
      setTimeout(async () => {
        await checkSellSignals();
        state.isTrading = false;
        document.getElementById('loader').style.display = 'none';
        document.getElementById('btnText').textContent = '🚀 Start Trading Agent';
        addLog('✅ Trading cycle complete');
      }, 5000);
    }
    
    function buyCoin(coin, amount) {
      const shares = amount / coin.price;
      const holding = state.portfolio.holdings[coin.id] || { amount: 0, avgPrice: 0, totalInvested: 0 };
      const newTotal = holding.amount + shares;
      holding.avgPrice = (holding.totalInvested + amount) / newTotal;
      holding.amount = newTotal;
      holding.totalInvested += amount;
      
      state.portfolio.holdings[coin.id] = holding;
      state.portfolio.cash -= amount;
      
      addLog(`📈 BUY ${shares.toFixed(4)} ${coin.symbol} @ $${coin.price.toFixed(2)} | Investment: $${amount.toFixed(2)}`);
      updateUI();
    }
    
    async function simulateHolding() {
      for (let i = 0; i < 3; i++) {
        await new Promise(r => setTimeout(r, 1000));
        state.coins = state.coins.map(c => ({
          ...c,
          price: c.price * (1 + (Math.random() - 0.5) * 0.02),
        }));
        displayCoins();
        updateUI();
      }
    }
    
    async function checkSellSignals() {
      const holdingEntries = Object.entries(state.portfolio.holdings);
      for (const [coinId, holding] of holdingEntries) {
        const coin = state.coins.find(c => c.id === coinId);
        if (!coin) continue;
        
        const profit = (coin.price - holding.avgPrice) / holding.avgPrice * 100;
        if (profit > 5 || profit < -3) {
          sellCoin(coinId, coin, holding, profit);
          await new Promise(r => setTimeout(r, 500));
        }
      }
    }
    
    function sellCoin(coinId, coin, holding, profitPercent) {
      const saleAmount = holding.amount * coin.price;
      const profitAmount = saleAmount - holding.totalInvested;
      
      state.portfolio.cash += saleAmount;
      delete state.portfolio.holdings[coinId];
      
      const profitStr = profitAmount >= 0 
        ? `+$${profitAmount.toFixed(2)}` 
        : `-$${Math.abs(profitAmount).toFixed(2)}`;
      
      addLog(`📉 SELL ${holding.amount.toFixed(4)} ${coin.symbol} @ $${coin.price.toFixed(2)} | Profit: ${profitStr} (${profitPercent.toFixed(2)}%)`);
      updateUI();
    }
    
    function updateUI() {
      updatePortfolioStats();
      displayHoldings();
    }
    
    function updatePortfolioStats() {
      const portfolioValue = calculatePortfolioValue();
      const profit = portfolioValue - state.portfolio.initialCash;
      const roi = (profit / state.portfolio.initialCash) * 100;
      const trades = state.portfolio.trades.filter(t => t.type === 'SELL');
      const winTrades = trades.filter(t => parseFloat(t.profit) > 0).length;
      const winRate = trades.length > 0 ? (winTrades / trades.length * 100).toFixed(0) : 0;
      
      document.getElementById('portfolioValue').textContent = `$${portfolioValue.toFixed(2)}`;
      const profitEl = document.getElementById('currentProfit');
      profitEl.textContent = `${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}`;
      profitEl.className = `stat-value ${profit >= 0 ? 'profit' : 'loss'}`;
      
      const roiEl = document.getElementById('currentROI');
      roiEl.textContent = `${roi >= 0 ? '+' : ''}${roi.toFixed(2)}%`;
      roiEl.className = `stat-value ${roi >= 0 ? 'profit' : 'loss'}`;
      
      document.getElementById('tradeCount').textContent = state.portfolio.trades.length;
      document.getElementById('winRate').textContent = `${winRate}%`;
    }
    
    function calculatePortfolioValue() {
      let value = state.portfolio.cash;
      for (const [coinId, holding] of Object.entries(state.portfolio.holdings)) {
        const coin = state.coins.find(c => c.id === coinId);
        if (coin) value += holding.amount * coin.price;
      }
      return value;
    }
    
    function displayHoldings() {
      const html = Object.entries(state.portfolio.holdings).map(([coinId, holding]) => {
        const coin = state.coins.find(c => c.id === coinId);
        if (!coin) return '';
        
        const currentValue = holding.amount * coin.price;
        const profit = currentValue - holding.totalInvested;
        const profitPercent = (profit / holding.totalInvested) * 100;
        
        return `
          <div class="coin-row ${profit >= 0 ? 'selected' : ''}">
            <div class="coin-rank">${coin.symbol}</div>
            <div class="coin-name">${holding.amount.toFixed(4)}</div>
            <div class="coin-price">$${currentValue.toFixed(2)}</div>
            <div class="coin-change ${profit >= 0 ? 'up' : 'down'}">
              ${profit >= 0 ? '+' : ''}${profit.toFixed(2)}
            </div>
            <div class="coin-score">${profitPercent >= 0 ? '+' : ''}${profitPercent.toFixed(1)}%</div>
          </div>
        `;
      }).filter(Boolean).join('');
      
      document.getElementById('holdings').innerHTML = html || 
        `<p style="color: var(--t2); text-align: center; padding: 20px;">No holdings yet</p>`;
    }
    
    function addLog(message) {
      const logs = document.getElementById('tradeLog');
      const time = new Date().toLocaleTimeString();
      
      const logEntry = document.createElement('div');
      logEntry.className = 'trade-item';
      logEntry.innerHTML = `<div class="trade-time">${time}</div><div class="trade-desc">${message}</div>`;
      
      logs.insertBefore(logEntry, logs.firstChild);
      if (logs.children.length > 100) logs.removeChild(logs.lastChild);
    }
    
    function resetPortfolio() {
      if (confirm('Reset all trades?')) {
        state.portfolio = { cash: 10000, initialCash: 10000, holdings: {}, trades: [] };
        updateUI();
        addLog('♻️ Portfolio reset');
      }
    }
    
    function exportReport() {
      const report = {
        timestamp: new Date().toISOString(),
        portfolio: state.portfolio,
        summary: {
          totalValue: calculatePortfolioValue(),
          profit: calculatePortfolioValue() - state.portfolio.initialCash,
          roi: ((calculatePortfolioValue() - state.portfolio.initialCash) / state.portfolio.initialCash * 100).toFixed(2) + '%',
        }
      };
      
      const json = JSON.stringify(report, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `trading-report-${Date.now()}.json`;
      a.click();
      addLog('⬇️ Report exported');
    }
    
    window.addEventListener('load', () => {
      fetchTopCoins();
      setInterval(fetchTopCoins, 10000);
      updateUI();
    });
  </script>
</body>
</html>
