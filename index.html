<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS - Real Autonomous AI Trading Agent</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(135deg, #0a0e27 0%, #141829 100%); color: #e4e6eb; font-family: 'Monaco', monospace; min-height: 100vh; }
    .container { max-width: 2200px; margin: 0 auto; padding: 20px; }
    header { text-align: center; padding: 30px; margin-bottom: 20px; background: rgba(168,85,247,0.15); border: 2px solid rgba(168,85,247,0.4); border-radius: 12px; }
    h1 { font-size: 2.8em; color: #a855f7; margin-bottom: 5px; }
    .subtitle { color: #a0a6b8; font-size: 13px; }
    .config { background: rgba(26,31,58,0.85); border: 1px solid rgba(168,85,247,0.3); padding: 20px; border-radius: 10px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto auto; gap: 12px; align-items: center; }
    .config-item { display: flex; flex-direction: column; gap: 5px; }
    .config-label { font-size: 11px; color: #a855f7; text-transform: uppercase; font-weight: bold; }
    input, select { padding: 10px; background: rgba(26,31,58,0.8); border: 1px solid rgba(168,85,247,0.3); color: #e4e6eb; border-radius: 6px; font-size: 12px; font-family: 'Monaco'; }
    .btn { padding: 10px 20px; background: linear-gradient(135deg, #a855f7, #3b82f6); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; height: fit-content; }
    .btn:hover { box-shadow: 0 0 15px rgba(168,85,247,0.4); }
    .btn-stop { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .status { display: inline-block; padding: 8px 16px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    .status.ready { background: rgba(16,185,129,0.2); color: #10b981; border: 1px solid #10b981; }
    .status.running { background: rgba(59,130,246,0.2); color: #3b82f6; border: 1px solid #3b82f6; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .panel { background: rgba(26,31,58,0.85); border: 1px solid rgba(168,85,247,0.2); border-radius: 10px; padding: 20px; }
    .panel h2 { color: #a855f7; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; }
    .chart-container { position: relative; height: 300px; margin-top: 15px; }
    .stat { padding: 15px; background: rgba(26,31,58,0.7); border-left: 3px solid #10b981; border-radius: 6px; margin-bottom: 12px; }
    .stat-label { font-size: 10px; color: #a0a6b8; margin-bottom: 6px; }
    .stat-value { font-size: 24px; font-weight: bold; color: #10b981; }
    .log { background: rgba(10,14,39,0.95); height: 300px; overflow-y: auto; border: 1px solid rgba(59,130,246,0.2); border-radius: 10px; padding: 15px; margin-top: 15px; }
    .log-entry { padding: 8px; margin-bottom: 6px; border-left: 3px solid #3b82f6; background: rgba(26,31,58,0.8); font-size: 10px; border-radius: 4px; }
    .log-entry.buy { border-left-color: #10b981; }
    .log-entry.sell { border-left-color: #ef4444; }
    .log-entry.claude { border-left-color: #a855f7; }
    .holding { padding: 10px; background: rgba(26,31,58,0.7); border-left: 3px solid #10b981; border-radius: 6px; margin-bottom: 8px; font-size: 10px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(26,31,58,0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.5); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 NEXUS – REAL AUTONOMOUS AI TRADING AGENT</h1>
      <p class="subtitle">Claude API • Live Price Charts • Real Buy/Sell • Full Transparency</p>
    </header>

    <div class="config">
      <div class="config-item">
        <label class="config-label">API Key</label>
        <input type="password" id="apiKey" placeholder="sk-ant-xxxxx">
      </div>
      
      <div class="config-item">
        <label class="config-label">Model</label>
        <select id="model">
          <option value="claude-opus-4-20250514">Opus 4</option>
          <option value="claude-sonnet-4-20250514" selected>Sonnet 4</option>
          <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
        </select>
      </div>

      <div class="config-item">
        <label class="config-label">Track Coin</label>
        <select id="trackCoin">
          <option value="XRP" selected>XRP</option>
          <option value="SOL">SOL</option>
          <option value="BTC">BTC</option>
          <option value="ETH">ETH</option>
          <option value="ADA">ADA</option>
        </select>
      </div>

      <div class="config-item">
        <label class="config-label">Max Positions</label>
        <input type="number" id="maxPos" value="5" min="1" max="20">
      </div>

      <button class="btn" id="startBtn" onclick="startAgent()">▶️ START</button>
      <button class="btn btn-stop" id="stopBtn" onclick="stopAgent()" style="display: none;">⏹️ STOP</button>
    </div>

    <div style="text-align: center; margin-bottom: 20px;">
      <span class="status ready" id="status">⏳ Ready</span>
      <span id="modelDisplay" style="margin-left: 15px; color: #a0a6b8; font-size: 12px;"></span>
    </div>

    <div class="layout">
      <div class="panel">
        <h2>📈 Live Price Chart - <span id="coinName">XRP</span></h2>
        <div style="padding: 10px; background: rgba(168,85,247,0.1); border-radius: 6px; margin-bottom: 15px; font-size: 11px;">
          <strong>Current Price:</strong> $<span id="currentPrice">0.52</span> | 
          <span id="stopLossDisplay">Stop Loss: $0.50</span> | 
          <span id="profitDisplay">Profit Target: $0.55</span>
        </div>
        <div class="chart-container">
          <canvas id="priceChart"></canvas>
        </div>
      </div>

      <div>
        <div class="panel">
          <h2>📊 Portfolio</h2>
          <div class="stat">
            <div class="stat-label">Total Value</div>
            <div class="stat-value" id="total">$10,000</div>
          </div>
          <div class="stat">
            <div class="stat-label">Cash</div>
            <div class="stat-value" id="cash">$10,000</div>
          </div>
          <div class="stat">
            <div class="stat-label">P&L</div>
            <div class="stat-value" id="pl" style="color: #10b981;">+$0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Trades</div>
            <div class="stat-value" id="trades">0</div>
          </div>
        </div>

        <div class="panel" style="margin-top: 20px;">
          <h2>📋 Holdings</h2>
          <div id="holdings"></div>
        </div>

        <div class="panel" style="margin-top: 20px;">
          <h2>📝 Trade Log</h2>
          <div class="log" id="log"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <script>
    let state = {
      active: false,
      apiKey: null,
      model: 'claude-sonnet-4-20250514',
      maxPos: 5,
      cash: 10000,
      holdings: {},
      ownedCoins: new Set(),
      trades: 0,
      priceHistory: [],
      trackCoin: 'XRP',
      lastClaudeCall: 0
    };

    let COINS = {
      BTC: { price: 45123, basePrice: 45123 },
      ETH: { price: 2850, basePrice: 2850 },
      SOL: { price: 102, basePrice: 102 },
      ADA: { price: 0.98, basePrice: 0.98 },
      XRP: { price: 0.52, basePrice: 0.52 }
    };

    let chart = null;

    function updatePrices() {
      Object.keys(COINS).forEach(symbol => {
        const randomChange = (Math.random() - 0.5) * 4;
        COINS[symbol].price = COINS[symbol].basePrice * (1 + randomChange / 100);
      });

      // Add to price history
      state.priceHistory.push({
        time: new Date().toLocaleTimeString(),
        price: COINS[state.trackCoin].price
      });

      if (state.priceHistory.length > 50) {
        state.priceHistory.shift();
      }

      updateChart();
    }

    function updateChart() {
      if (!chart) {
        const ctx = document.getElementById('priceChart').getContext('2d');
        
        let stopLoss = 0, profitTarget = 0;
        if (state.ownedCoins.has(state.trackCoin)) {
          const holding = state.holdings[state.trackCoin];
          stopLoss = holding.entry * 0.97;
          profitTarget = holding.entry * 1.05;
        }

        chart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: state.priceHistory.map((_, i) => i),
            datasets: [
              {
                label: `${state.trackCoin} Price`,
                data: state.priceHistory.map(p => p.price),
                borderColor: '#a855f7',
                backgroundColor: 'rgba(168,85,247,0.1)',
                tension: 0.4,
                fill: true,
                pointRadius: 2
              },
              stopLoss > 0 ? {
                label: 'Stop Loss (-3%)',
                data: Array(state.priceHistory.length).fill(stopLoss),
                borderColor: '#ef4444',
                borderDash: [5, 5],
                fill: false,
                pointRadius: 0
              } : null,
              profitTarget > 0 ? {
                label: 'Profit Target (+5%)',
                data: Array(state.priceHistory.length).fill(profitTarget),
                borderColor: '#10b981',
                borderDash: [5, 5],
                fill: false,
                pointRadius: 0
              } : null
            ].filter(d => d)
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: '#a0a6b8', font: { size: 10 } } }
            },
            scales: {
              y: { ticks: { color: '#a0a6b8', font: { size: 9 } }, grid: { color: 'rgba(168,85,247,0.1)' } },
              x: { ticks: { color: '#a0a6b8', font: { size: 9 } }, grid: { display: false } }
            }
          }
        });
      } else {
        chart.data.labels = state.priceHistory.map((_, i) => i);
        chart.data.datasets[0].data = state.priceHistory.map(p => p.price);
        chart.update('none');
      }
    }

    function log(msg, type = 'default') {
      const logEl = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function callClaude(prompt) {
      try {
        const response = await fetch('/api/claude', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, model: state.model, apiKey: state.apiKey })
        });
        if (!response.ok) return null;
        const data = await response.json();
        return data.decision;
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
        return null;
      }
    }

    function checkExits() {
      for (const [symbol, holding] of Object.entries(state.holdings)) {
        const currentPrice = COINS[symbol].price;
        if (currentPrice <= holding.entry * 0.97) {
          const saleAmount = holding.shares * currentPrice;
          state.cash += saleAmount;
          state.ownedCoins.delete(symbol);
          delete state.holdings[symbol];
          log(`🛑 SOLD ${symbol} @ $${currentPrice.toFixed(4)} (STOP LOSS)`, 'sell');
        }
        else if (currentPrice >= holding.entry * 1.05) {
          const saleAmount = holding.shares * currentPrice;
          state.cash += saleAmount;
          state.ownedCoins.delete(symbol);
          delete state.holdings[symbol];
          log(`✅ SOLD ${symbol} @ $${currentPrice.toFixed(4)} (PROFIT TARGET)`, 'sell');
        }
      }
    }

    async function autonomousLoop() {
      if (!state.active) return;

      updatePrices();
      checkExits();

      const now = Date.now();
      if ((now - state.lastClaudeCall) >= 30000) {
        state.lastClaudeCall = now;
        
        const analysis = Object.entries(COINS)
          .map(([s, c]) => `${s}: $${c.price.toFixed(2)}`)
          .join(', ');

        const owned = Array.from(state.ownedCoins).join(', ') || 'None';
        const prompt = `Crypto: ${analysis}. Owned: ${owned}. Max ${state.maxPos}. BUY which coin or HOLD? One word.`;

        const decision = await callClaude(prompt);

        if (decision && decision.includes('BUY')) {
          const match = decision.match(/BTC|ETH|SOL|ADA|XRP/);
          if (match && state.ownedCoins.size < state.maxPos && !state.ownedCoins.has(match[0])) {
            const coin = match[0];
            const amount = Math.min(state.cash * 0.3, 3000);
            if (amount > COINS[coin].price) {
              const shares = amount / COINS[coin].price;
              state.holdings[coin] = { shares, entry: COINS[coin].price };
              state.ownedCoins.add(coin);
              state.cash -= amount;
              state.trades++;
              log(`✅ BOUGHT ${coin} @ $${COINS[coin].price.toFixed(4)}`, 'buy');
            }
          }
        }
      }

      updateUI();
      if (state.active) setTimeout(autonomousLoop, 8000);
    }

    function updateUI() {
      const total = state.cash + Object.entries(state.holdings).reduce((a, [s, h]) => a + h.shares * COINS[s].price, 0);
      const pl = total - 10000;

      document.getElementById('total').textContent = `$${total.toFixed(2)}`;
      document.getElementById('cash').textContent = `$${state.cash.toFixed(2)}`;
      document.getElementById('pl').textContent = (pl >= 0 ? '+' : '') + `$${pl.toFixed(2)}`;
      document.getElementById('pl').style.color = pl >= 0 ? '#10b981' : '#ef4444';
      document.getElementById('trades').textContent = state.trades;

      document.getElementById('currentPrice').textContent = COINS[state.trackCoin].price.toFixed(state.trackCoin === 'BTC' ? 0 : 4);

      if (state.ownedCoins.has(state.trackCoin)) {
        const holding = state.holdings[state.trackCoin];
        document.getElementById('stopLossDisplay').textContent = `Stop Loss: $${(holding.entry * 0.97).toFixed(4)}`;
        document.getElementById('profitDisplay').textContent = `Profit Target: $${(holding.entry * 1.05).toFixed(4)}`;
      }

      const holdingsEl = document.getElementById('holdings');
      holdingsEl.innerHTML = state.ownedCoins.size === 0 ? '<div style="color:#a0a6b8;font-size:10px;">No holdings</div>' :
        Array.from(state.ownedCoins).map(s => {
          const h = state.holdings[s];
          const val = h.shares * COINS[s].price;
          const pnl = val - h.shares * h.entry;
          return `<div class="holding">${s}: ${h.shares.toFixed(2)} @ $${h.entry.toFixed(4)} | P&L: ${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</div>`;
        }).join('');
    }

    function startAgent() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key.startsWith('sk-ant-')) {
        log('❌ Invalid API key', 'error');
        return;
      }

      state.apiKey = key;
      state.model = document.getElementById('model').value;
      state.trackCoin = document.getElementById('trackCoin').value;
      state.maxPos = parseInt(document.getElementById('maxPos').value);
      state.active = true;
      state.priceHistory = [];

      document.getElementById('status').className = 'status running';
      document.getElementById('status').textContent = '✅ RUNNING';
      document.getElementById('coinName').textContent = state.trackCoin;
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';

      log(`🚀 Agent started tracking ${state.trackCoin}`, 'claude');
      autonomousLoop();
    }

    function stopAgent() {
      state.active = false;
      document.getElementById('status').className = 'status ready';
      document.getElementById('status').textContent = '⏹️ STOPPED';
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';
      log('⏹️ Agent stopped', 'default');
    }
  </script>
</body>
</html>
