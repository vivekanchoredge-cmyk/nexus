<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ULTIMATE - Real AI Agent + Trading Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(135deg, #0a0e27 0%, #141829 100%); color: #e4e6eb; font-family: 'Monaco', monospace; }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    header { text-align: center; padding: 30px; margin-bottom: 20px; background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.3); border-radius: 10px; }
    header h1 { font-size: 2.5em; color: #a855f7; margin-bottom: 10px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 12px 24px; background: rgba(26,31,58,0.8); border: 1px solid rgba(168,85,247,0.3); color: #a855f7; cursor: pointer; border-radius: 6px; font-weight: bold; transition: all 0.3s; }
    .tab-btn.active { background: linear-gradient(135deg, #a855f7, #3b82f6); color: white; border-color: #a855f7; }
    .tab-btn:hover { transform: translateY(-2px); }
    .tab-content { display: none; animation: fadeIn 0.3s; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .chat-container { display: grid; grid-template-columns: 1fr 300px; gap: 20px; height: 600px; }
    .chat-messages { background: rgba(10,14,39,0.9); border: 1px solid rgba(59,130,246,0.2); border-radius: 10px; padding: 15px; overflow-y: auto; }
    .message { padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 3px solid #3b82f6; background: rgba(26,31,58,0.8); font-size: 12px; line-height: 1.5; }
    .message.user { border-left-color: #a855f7; background: rgba(168,85,247,0.1); }
    .chat-input { display: flex; gap: 10px; margin-top: 15px; }
    .chat-input input { flex: 1; padding: 12px; background: rgba(26,31,58,0.8); border: 1px solid rgba(59,130,246,0.3); color: #e4e6eb; border-radius: 6px; }
    .chat-input button { padding: 12px 24px; background: linear-gradient(135deg, #a855f7, #3b82f6); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .sidebar { background: rgba(26,31,58,0.8); border: 1px solid rgba(168,85,247,0.2); border-radius: 10px; padding: 15px; }
    .sidebar h3 { color: #a855f7; margin-bottom: 10px; font-size: 14px; }
    .sidebar-item { padding: 8px; background: rgba(26,31,58,0.6); border-radius: 4px; margin-bottom: 8px; font-size: 11px; }
    .agent-container { padding: 20px; }
    .agent-header { text-align: center; margin-bottom: 20px; }
    .agent-header h2 { color: #a855f7; font-size: 2em; margin-bottom: 10px; }
    .agent-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
    .stat-box { padding: 15px; background: rgba(26,31,58,0.8); border: 1px solid rgba(59,130,246,0.3); border-radius: 8px; }
    .stat-label { font-size: 10px; color: #a0a6b8; text-transform: uppercase; margin-bottom: 8px; }
    .stat-value { font-size: 22px; font-weight: bold; color: #e4e6eb; }
    .agent-main { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .agent-chat { background: rgba(26,31,58,0.8); border: 1px solid rgba(168,85,247,0.2); border-radius: 10px; padding: 20px; }
    .chat-log { height: 400px; overflow-y: auto; margin-bottom: 15px; border: 1px solid rgba(59,130,246,0.2); border-radius: 6px; padding: 10px; background: rgba(10,14,39,0.7); }
    .chat-message { padding: 10px; margin-bottom: 8px; background: rgba(26,31,58,0.8); border-left: 3px solid #3b82f6; border-radius: 4px; font-size: 12px; line-height: 1.5; }
    .chat-message.user { border-left-color: #a855f7; background: rgba(168,85,247,0.1); }
    .chat-message.agent { border-left-color: #10b981; }
    .chat-input-area { display: flex; gap: 10px; }
    .chat-input-area input { flex: 1; padding: 10px; background: rgba(26,31,58,0.8); border: 1px solid rgba(59,130,246,0.3); border-radius: 6px; color: #e4e6eb; }
    .chat-input-area button { padding: 10px 20px; background: linear-gradient(135deg, #a855f7, #3b82f6); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .agent-portfolio { background: rgba(26,31,58,0.8); border: 1px solid rgba(168,85,247,0.2); border-radius: 10px; padding: 20px; }
    .agent-portfolio h3 { color: #a855f7; margin-bottom: 15px; font-size: 14px; }
    .holding-item { padding: 10px; background: rgba(26,31,58,0.6); border-radius: 6px; margin-bottom: 8px; font-size: 11px; border-left: 3px solid #10b981; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(26,31,58,0.3); }
    ::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.5); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 NEXUS ULTIMATE</h1>
      <p>AI Agent + Real Trading Agent with Demo Coins</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('chat')">💬 Chat</button>
      <button class="tab-btn" onclick="showTab('agent')">🤖 Trading Agent</button>
    </div>

    <!-- CHAT TAB -->
    <div id="chat" class="tab-content active">
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="sidebar">
          <h3>Quick Commands</h3>
          <div class="sidebar-item">• Code generation</div>
          <div class="sidebar-item">• Analysis</div>
          <div class="sidebar-item">• Strategy</div>
          <div class="sidebar-item">• Debugging</div>
        </div>
      </div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Ask me anything..." onkeypress="if(event.key==='Enter') sendChat()">
        <button onclick="sendChat()">Send</button>
      </div>
    </div>

    <!-- TRADING AGENT TAB -->
    <div id="agent" class="tab-content">
      <div class="agent-container">
        <div class="agent-header">
          <h2>🤖 REAL TRADING AGENT</h2>
          <p>Give commands. Agent analyzes and trades with demo coins.</p>
        </div>
        
        <div class="agent-stats">
          <div class="stat-box">
            <div class="stat-label">Portfolio Value</div>
            <div class="stat-value" id="agentPortfolio">$10,000</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Profit/Loss</div>
            <div class="stat-value" id="agentPL">+$0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Trades Executed</div>
            <div class="stat-value" id="agentTrades">0</div>
          </div>
        </div>
        
        <div class="agent-main">
          <div class="agent-chat">
            <div class="chat-log" id="agentLog"></div>
            
            <div class="chat-input-area">
              <input 
                type="text" 
                id="agentCommand" 
                placeholder="e.g., 'Analyze coins', 'Buy BTC for 500', 'Sell SOL', 'Show portfolio'"
                onkeypress="if(event.key==='Enter') sendAgentCommand()"
              />
              <button onclick="sendAgentCommand()">Send</button>
              <button onclick="resetAgent()">Reset</button>
            </div>
          </div>
          
          <div class="agent-portfolio">
            <h3>Holdings</h3>
            <div id="agentHoldings"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // TAB SWITCHING
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    // CHAT FUNCTIONALITY
    function sendChat() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      
      const messagesEl = document.getElementById('chatMessages');
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = 'You: ' + msg;
      messagesEl.appendChild(userMsg);
      
      input.value = '';
      messagesEl.scrollTop = messagesEl.scrollHeight;
      
      setTimeout(() => {
        const agentMsg = document.createElement('div');
        agentMsg.className = 'message';
        agentMsg.textContent = 'Agent: I received your message: "' + msg + '". This is a demo interface. For real Claude integration, connect to Anthropic API.';
        messagesEl.appendChild(agentMsg);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }, 500);
    }

    // TRADING AGENT
    const DEMO_COINS = {
      'BTC': { price: 45123, change: 8.5, name: 'Bitcoin' },
      'ETH': { price: 2850, change: 6.3, name: 'Ethereum' },
      'SOL': { price: 102, change: 9.1, name: 'Solana' },
      'ADA': { price: 0.98, change: 7.2, name: 'Cardano' },
      'AVAX': { price: 35, change: 5.8, name: 'Avalanche' },
      'XRP': { price: 0.52, change: 10.4, name: 'Ripple' },
      'DOT': { price: 7.45, change: 6.9, name: 'Polkadot' },
      'LTC': { price: 550, change: 4.5, name: 'Litecoin' },
    };

    const agentState = {
      portfolio: 10000,
      initial: 10000,
      holdings: {},
      trades: 0,
    };

    function addAgentMessage(msg, type = 'agent') {
      const log = document.getElementById('agentLog');
      const msgEl = document.createElement('div');
      msgEl.className = 'chat-message ' + type;
      msgEl.textContent = msg;
      log.appendChild(msgEl);
      log.scrollTop = log.scrollHeight;
    }

    function updateAgentUI() {
      const holdings = Object.entries(agentState.holdings).reduce((a, [symbol, h]) => a + h.amount * DEMO_COINS[symbol].price, 0);
      const total = agentState.portfolio + holdings;
      const pl = total - agentState.initial;
      
      document.getElementById('agentPortfolio').textContent = '$' + total.toFixed(2);
      document.getElementById('agentPL').textContent = (pl >= 0 ? '+' : '') + '$' + pl.toFixed(2);
      document.getElementById('agentTrades').textContent = agentState.trades;
      
      const holdingsHTML = Object.entries(agentState.holdings).map(([symbol, h]) => {
        const coin = DEMO_COINS[symbol];
        const val = h.amount * coin.price;
        const profit = val - h.invested;
        return `<div class="holding-item">${symbol}: ${h.amount.toFixed(4)} | $${val.toFixed(2)} | ${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}</div>`;
      }).join('') || '<p style="color: #a0a6b8; padding: 10px;">No holdings yet</p>';
      
      document.getElementById('agentHoldings').innerHTML = holdingsHTML;
    }

    function sendAgentCommand() {
      const input = document.getElementById('agentCommand');
      const cmd = input.value.trim().toLowerCase();
      
      if (!cmd) return;
      
      addAgentMessage('You: ' + cmd, 'user');
      input.value = '';
      
      if (cmd.includes('analyze') || cmd.includes('coins')) {
        let response = '📊 Top Coins:\n';
        Object.entries(DEMO_COINS).forEach(([symbol, coin]) => {
          response += `${symbol} $${coin.price.toFixed(2)} (${coin.change >= 0 ? '+' : ''}${coin.change}%)\n`;
        });
        addAgentMessage(response, 'agent');
      }
      else if (cmd.includes('buy')) {
        const amount = parseInt(cmd.match(/\d+/)?.[0]) || 500;
        const symbol = cmd.match(/BTC|ETH|SOL|ADA|AVAX|XRP|DOT|LTC/i)?.[0]?.toUpperCase();
        
        if (symbol && DEMO_COINS[symbol]) {
          const coin = DEMO_COINS[symbol];
          const shares = amount / coin.price;
          
          if (agentState.portfolio >= amount) {
            agentState.holdings[symbol] = { amount: shares, invested: amount };
            agentState.portfolio -= amount;
            agentState.trades++;
            addAgentMessage(`✅ Bought ${shares.toFixed(4)} ${symbol} for $${amount}`, 'agent');
          } else {
            addAgentMessage(`❌ Insufficient funds. Have $${agentState.portfolio.toFixed(2)}, need $${amount}`, 'agent');
          }
        } else {
          addAgentMessage('❌ Specify coin: BTC, ETH, SOL, ADA, AVAX, XRP, DOT, LTC', 'agent');
        }
      }
      else if (cmd.includes('sell')) {
        const symbol = cmd.match(/BTC|ETH|SOL|ADA|AVAX|XRP|DOT|LTC/i)?.[0]?.toUpperCase();
        
        if (symbol && agentState.holdings[symbol]) {
          const h = agentState.holdings[symbol];
          const coin = DEMO_COINS[symbol];
          const saleAmount = h.amount * coin.price;
          const profit = saleAmount - h.invested;
          
          agentState.portfolio += saleAmount;
          delete agentState.holdings[symbol];
          agentState.trades++;
          
          addAgentMessage(`✅ Sold ${h.amount.toFixed(4)} ${symbol} | P&L: ${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}`, 'agent');
        } else {
          addAgentMessage('❌ No holdings to sell', 'agent');
        }
      }
      else if (cmd.includes('portfolio') || cmd.includes('show')) {
        addAgentMessage('📈 Holdings: ' + (Object.keys(agentState.holdings).length > 0 ? Object.entries(agentState.holdings).map(([s, h]) => `${s}: ${h.amount.toFixed(4)}`).join(' | ') : 'Empty'), 'agent');
      }
      else {
        addAgentMessage('Commands: analyze | buy [COIN] [amount] | sell [COIN] | portfolio', 'agent');
      }
      
      updateAgentUI();
    }

    function resetAgent() {
      agentState.portfolio = 10000;
      agentState.holdings = {};
      agentState.trades = 0;
      document.getElementById('agentLog').innerHTML = '';
      addAgentMessage('♻️ Portfolio reset to $10,000', 'agent');
      updateAgentUI();
    }

    // Initialize
    updateAgentUI();
  </script>
</body>
</html>
